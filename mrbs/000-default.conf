<VirtualHost *:80>
	ServerName https://klubovna.fmph.uniba.sk:443
        ServerAdmin fmfi-svt@googlegroups.com
        DocumentRoot /var/www/html

	<Location />
		AuthType shibboleth
		ShibRequestSetting requireSession 1
		Require valid-user
	</Location>

        ErrorLog /dev/stderr
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
