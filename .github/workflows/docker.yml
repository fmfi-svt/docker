name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed image directories
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          directories = sorted(
              path.name for path in Path('.').iterdir()
              if path.is_dir() and (path / 'Dockerfile').is_file()
          )
          before = os.environ['BEFORE']
          base_available = os.environ['EVENT_NAME'] != 'workflow_dispatch' and before and set(before) != {'0'} and subprocess.run(
              ['git', 'cat-file', '-e', f'{before}^{{commit}}'],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          # Manual runs, new branches, and unavailable bases build all images.
          if base_available:
              changed_paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z', before, 'HEAD', '--',
              ]).decode().split('\0')
              changed_directories = {path.split('/', 1)[0] for path in changed_paths if path}
              directories = [name for name in directories if name in changed_directories]

          matrix = {'include': [
              {'directory': name, 'image': f'ghcr.io/fmfi-svt/docker-{name.lower()}'}
              for name in directories
          ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={json.dumps(matrix)}\n')
              output.write(f'has_changes={str(bool(directories)).lower()}\n')

  build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.directory }}
          file: ./${{ matrix.directory }}/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.directory }}
          cache-to: type=gha,mode=max,scope=${{ matrix.directory }}
